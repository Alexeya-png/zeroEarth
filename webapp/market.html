<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Market</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

    :root{
      --bg: #0a0e14;
      --bg2: #0d1117;
      --card: #131920;
      --card2: #111720;
      --card-hover: #181f28;
      --text: #e8edf5;
      --muted: #8899ad;
      --stroke: rgba(255,255,255,.06);
      --stroke-hover: rgba(255,255,255,.12);
      --accent: #3b8ff5;
      --accent-glow: rgba(59,143,245,.15);
      --accent-text: #7ab8ff;
      --warn: #f5c842;
      --warn-glow: rgba(245,200,66,.1);
      --success: #34d399;
      --danger: #f87171;
      --radius: 14px;
      --radius-sm: 10px;
      --pad: 16px;
      --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      --mono: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --nav-height: 64px;
    }

    html, body { height: 100%; }
    body{
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    .wrap{
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 14px;
      padding-bottom: calc(var(--nav-height) + 24px + env(safe-area-inset-bottom, 0px));
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: var(--pad);
      box-shadow:
        0 2px 8px rgba(0,0,0,.2),
        0 12px 40px rgba(0,0,0,.15);
      backdrop-filter: blur(12px);
    }

    .title{
      display:flex;
      gap: 12px;
      align-items:flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    h1{
      margin:0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.2px;
      background: linear-gradient(135deg, var(--text) 0%, var(--muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sub{
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .badges{
      margin-top: 10px;
      display:flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge{
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.03);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge.tier{
      border-color: rgba(59,143,245,.3);
      background: var(--accent-glow);
      color: var(--accent-text);
    }

    .section{
      margin-top: 16px;
      border-top: 1px solid var(--stroke);
      padding-top: 14px;
    }

    .section h2{
      margin: 0 0 10px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .rows{
      display:flex;
      flex-direction: column;
      gap: 6px;
    }

    .row{
      display:flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border: 1px solid var(--stroke);
      border-radius: var(--radius-sm);
      background: rgba(0,0,0,.15);
      transition: background .15s, border-color .15s;
    }

    .row:hover{
      background: rgba(0,0,0,.25);
      border-color: var(--stroke-hover);
    }

    .row.active{
      border-color: rgba(59,143,245,.3);
      background: var(--accent-glow);
    }

    .k{
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      min-width: 18px;
      text-align: right;
    }

    .v{
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      flex: 1;
    }

    .v.mono{
      font-family: var(--mono);
      font-weight: 700;
      letter-spacing: .3px;
    }

    .row.stars{
      border-color: rgba(245,200,66,.2);
      background: var(--warn-glow);
    }

    .btn{
      border: 1px solid var(--stroke-hover);
      background: rgba(255,255,255,.04);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      font-family: var(--sans);
    }

    .btn:hover{
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.2);
    }

    .btn:active{ transform: scale(0.97); }

    .btn.primary{
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn.primary:hover{
      background: #4d9af7;
    }

    .btnSmall{
      border: 1px solid var(--stroke-hover);
      background: rgba(255,255,255,.04);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
      font-family: var(--sans);
    }

    .btnSmall:hover{
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.2);
    }

    .btnSmall:active{ transform: scale(0.97); }

    .inputRow{
      display:flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .inp{
      flex: 1;
      border: 1px solid var(--stroke);
      background: rgba(0,0,0,.25);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      font-family: var(--sans);
      transition: border-color .15s, box-shadow .15s;
    }

    .inp:focus{
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .inp::placeholder{ color: var(--muted); opacity: 0.6; }

    .loading{
      color: var(--muted);
      padding: 32px 6px;
      text-align:center;
      font-size: 14px;
    }

    .loading::after{
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      margin-left: 8px;
      border: 2px solid var(--stroke);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .err{
      color: var(--danger);
      font-size: 13px;
      margin-top: 8px;
      text-align:center;
      padding: 8px;
      background: rgba(248,113,113,.06);
      border-radius: var(--radius-sm);
    }

    .link{
      color: var(--accent-text);
      cursor: pointer;
      text-decoration: none;
      transition: opacity .15s;
    }

    .link:hover{ opacity: .85; }
    .link:active{ opacity: .7; }

    .pill{
      display:inline-block;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.03);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-left: 8px;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    .modalBg{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      display:none;
      align-items: flex-end;
      justify-content: center;
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
    }

    .modal{
      width: 100%;
      max-width: 520px;
      background: var(--card2);
      border: 1px solid var(--stroke-hover);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 -4px 40px rgba(0,0,0,.4);
      animation: slideUp .25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modalTop{
      display:flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .modalTitle{
      font-size: 16px;
      font-weight: 700;
    }

    .xBtn{
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }

    .xBtn:hover{
      background: rgba(255,255,255,.08);
      color: var(--text);
    }

    /* ── Bottom Navigation ── */
    .bottomNav{
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--bg2);
      border-top: 1px solid var(--stroke);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      z-index: 90;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .navBtn{
      flex: 1;
      max-width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 0;
      border: none;
      background: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      font-family: var(--sans);
      cursor: pointer;
      text-decoration: none;
      transition: color .15s;
      letter-spacing: 0.3px;
      border-radius: 8px;
    }

    .navBtn:hover{ color: var(--text); }

    .navBtn.active{
      color: var(--accent-text);
    }

    .navBtn.active .navIcon{
      background: var(--accent-glow);
      border-color: rgba(59,143,245,.25);
    }

    .navIcon{
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: all .15s;
    }

    .navIcon svg{
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="app">
      <div class="loading">Загрузка</div>
    </div>
  </div>

  <nav class="bottomNav">
    <a href="/stash" class="navBtn" id="navStash">
      <div class="navIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        </svg>
      </div>
      <span>Склад</span>
    </a>
    <a href="/market" class="navBtn active" id="navMarket">
      <div class="navIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
      </div>
      <span>Рынок</span>
    </a>
  </nav>

  <div class="modalBg" id="modalBg">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalTop">
        <div class="modalTitle" id="modalTitle">Калибр</div>
        <button class="xBtn" id="modalClose" aria-label="Закрыть">&#x2715;</button>
      </div>
      <div class="rows" id="modalRows"></div>
    </div>
  </div>

  <script>
    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function num(v){
      if (v == null) return "\u2013";
      const n = Number(v);
      if (!Number.isFinite(n)) return "\u2013";
      return String(n);
    }

    function numSigned(v){
      if (v == null) return "\u2013";
      const n = Number(v);
      if (!Number.isFinite(n)) return "\u2013";
      if (n > 0) return "+" + n;
      return String(n);
    }

    function kg(v){
      const n = Number(v);
      if (!Number.isFinite(n)) return "\u2013";
      return (Math.round(n * 100) / 100).toFixed(2).replaceAll(".00","") + " \u043A\u0433";
    }

    function money(v){
      if (v == null) return "\u2013";
      const n = Number(v);
      if (!Number.isFinite(n)) return "\u2013";
      return n.toLocaleString("ru-RU") + " \u27E1";
    }

    function moneyPlain(v){
      if (v == null) return "\u2013";
      const n = Number(v);
      if (!Number.isFinite(n)) return "\u2013";
      return String(Math.trunc(n));
    }

    let _buyCtx = null;

    function calcPrice(lotPrice, lotQty, buyQty){
      const p = Number(lotPrice || 0);
      const q = Number(lotQty || 1);
      const b = Number(buyQty || 0);
      if (!Number.isFinite(p) || !Number.isFinite(q) || !Number.isFinite(b) || q <= 0 || b <= 0) return 0;
      return Math.floor((p * b) / q);
    }

    function updateBuyHint(){
      if (!_buyCtx) return;
      const hint = document.getElementById("buyHint");
      const inp = document.getElementById("buyQty");
      if (!hint || !inp) return;

      const max = Number(_buyCtx.max || 1);
      const lotQty = Number(_buyCtx.lotQty || 1);
      const lotPrice = Number(_buyCtx.lotPrice || 0);
      let qty = Number(inp.value || 1);
      if (!Number.isFinite(qty) || qty < 1) qty = 1;
      qty = Math.min(max, qty);
      inp.value = String(qty);

      const price = calcPrice(lotPrice, lotQty, qty);
      hint.textContent = `\u041A \u043E\u043F\u043B\u0430\u0442\u0435: ${moneyPlain(price)}`;
    }

    function stars(v){
      if (v == null) return "\u2013";
      const n = Number(v);
      if (!Number.isFinite(n)) return "\u2013";
      return n.toLocaleString("ru-RU") + " \u2B50";
    }

    function tierFrom(item){
      return item?.equipment_stats?.tier || item?.weapon_mod?.tier || item?.quality_tier || "\u2013";
    }

    function tagType(item){
      const t = String(item?.item_type || "\u2013").toLowerCase();
      if (t === "weapon") return "weapon";
      if (t === "ammo") return "ammo";
      if (t === "head") return "head";
      if (t === "body") return "body";
      if (t === "gloves") return "gloves";
      if (t === "boots") return "boots";
      return t || "misc";
    }

    function row(k, v, cls="", active=false){
      return `
        <div class="row ${cls} ${active ? "active" : ""}">
          <div class="k">${escapeHtml(k)}</div>
          <div class="v">${escapeHtml(v)}</div>
        </div>
      `;
    }

    function rowHtml(k, vHtml, cls="", active=false){
      return `
        <div class="row ${cls} ${active ? "active" : ""}">
          <div class="k">${escapeHtml(k)}</div>
          <div class="v">${vHtml}</div>
        </div>
      `;
    }

    function section(title, rowsHtml){
      if (!rowsHtml) return "";
      return `
        <div class="section">
          <h2>${escapeHtml(title)}</h2>
          <div class="rows">${rowsHtml}</div>
        </div>
      `;
    }

    function bonusKeyRu(k){
      const m = {
        accuracy_bonus: "\u0422\u043E\u0447\u043D\u043E\u0441\u0442\u044C",
        reliability_bonus: "\u041D\u0430\u0434\u0435\u0436\u043D\u043E\u0441\u0442\u044C",
        damage_bonus: "\u0423\u0440\u043E\u043D",
        armor_pen_bonus: "\u041F\u0440\u043E\u0431\u0438\u0442\u0438\u0435",
        stealth_bonus: "\u0421\u043A\u0440\u044B\u0442\u043D\u043E\u0441\u0442\u044C",
        carry_capacity_bonus: "\u041F\u0435\u0440\u0435\u043D\u043E\u0441\u043A\u0430",
        loot_analysis_bonus: "\u0420\u0430\u0441\u043F\u043E\u0437\u043D\u0430\u0432\u0430\u043D\u0438\u0435 \u043F\u0440\u0435\u0434\u043C\u0435\u0442\u043E\u0432",
        armor: "\u0411\u0440\u043E\u043D\u044F"
      };
      return m[k] || k;
    }

    function showModal(title, rowsHtmlArr){
      const bg = document.getElementById("modalBg");
      const t = document.getElementById("modalTitle");
      const rows = document.getElementById("modalRows");
      t.textContent = title;
      rows.innerHTML = rowsHtmlArr.join("");
      bg.style.display = "flex";
    }

    function hideModal(){
      document.getElementById("modalBg").style.display = "none";
    }

    document.getElementById("modalClose").addEventListener("click", hideModal);
    document.getElementById("modalBg").addEventListener("click", (e) => {
      if (e.target.id === "modalBg") hideModal();
    });

    const TG = (window.Telegram && Telegram.WebApp) ? Telegram.WebApp : null;

    function _safeDecodeURIComponent(v){
      if (v === null || v === undefined) return "";
      const s = String(v);
      if (!s) return "";
      try { return decodeURIComponent(s); } catch(_e) { return s; }
    }

    function _getInitDataFromUrl(){
      try {
        const u = new URL(window.location.href);

        let v = u.searchParams.get("initData") || u.searchParams.get("init_data") || u.searchParams.get("tgWebAppData") || "";
        if (v) return _safeDecodeURIComponent(v);

        const h = (u.hash || "").replace(/^#/, "");
        if (!h) return "";
        const hp = new URLSearchParams(h);
        v = hp.get("tgWebAppData") || hp.get("initData") || hp.get("init_data") || "";
        if (v) return _safeDecodeURIComponent(v);
      } catch(_e) {}
      return "";
    }

    function getInitData(){
      try {
        const v = (TG && TG.initData) ? String(TG.initData || "").trim() : "";
        if (v) return v;
      } catch(_e) {}

      const u = _getInitDataFromUrl();
      if (u) return u;

      return "";
    }

    const TG_INIT_DATA = getInitData();


    function notify(msg){
      const m = String(msg || '').trim();
      if(!m) return;
      try{ if(TG && typeof TG.showAlert === 'function'){ TG.showAlert(m); return; } }catch(e){}
      try{ window.alert(m); }catch(e){}
    }

    async function fetchJson(url, opts){
      try{
        const o = opts || {};
        const headers = Object.assign({}, o.headers || {});

        if (o.auth && TG_INIT_DATA){
          headers["X-Tg-InitData"] = TG_INIT_DATA;
        }

        const init = {
          method: o.method || "GET",
          cache: "no-store",
          headers
        };

        if (o.json != null){
          init.method = o.method || "POST";
          headers["Content-Type"] = "application/json";
          init.body = JSON.stringify(o.json);
        }

        const r = await fetch(url, init);
        const j = await r.json();
        return j;
      }catch(e){
        return null;
      }
    }

    function normalizeItemType(t){
      const s = String(t || "misc").trim();
      if (!s) return "misc";
      return s;
    }

    function isMiscType(t){
      return String(t || "").trim().toLowerCase() === "misc";
    }

    function normalizeMarketItem(raw){
      const id = Number(raw?.item_id ?? raw?.itemId ?? raw?.id ?? raw?.item ?? 0);
      if (!Number.isFinite(id) || id <= 0) return null;

      const name = String(raw?.name ?? raw?.item_name ?? raw?.itemName ?? "\u041F\u0440\u0435\u0434\u043C\u0435\u0442").trim() || "\u041F\u0440\u0435\u0434\u043C\u0435\u0442";
      const item_type = normalizeItemType(raw?.item_type ?? raw?.itemType ?? raw?.type ?? "misc");
      const tier = String(raw?.tier ?? raw?.quality_tier ?? "").trim();
      const lots_count = Number(raw?.lots_count ?? raw?.count ?? raw?.lots ?? raw?.cnt ?? 0);
      const qty_total = Number(raw?.qty_total ?? raw?.qty ?? raw?.total_qty ?? 0);

      return {
        item_id: id,
        name,
        item_type,
        tier,
        lots_count: Number.isFinite(lots_count) ? lots_count : 0,
        qty_total: Number.isFinite(qty_total) ? qty_total : 0
      };
    }

    function groupItemsFromListings(listings){
      const by = new Map();
      for (const l of (listings || [])){
        const itemId = Number(l?.item_id ?? l?.itemId ?? l?.item ?? l?.itemID ?? 0);
        if (!Number.isFinite(itemId) || itemId <= 0) continue;

        const prev = by.get(itemId) || {
          item_id: itemId,
          name: String(l?.item_name ?? l?.itemName ?? l?.name ?? "\u041F\u0440\u0435\u0434\u043C\u0435\u0442").trim() || "\u041F\u0440\u0435\u0434\u043C\u0435\u0442",
          item_type: normalizeItemType(l?.item_type ?? l?.itemType ?? l?.type ?? "misc"),
          tier: String(l?.tier ?? "").trim(),
          lots_count: 0,
          qty_total: 0
        };

        prev.lots_count += 1;

        const q = Number(l?.qty ?? l?.quantity ?? 0);
        if (Number.isFinite(q)) prev.qty_total += q;

        if (!prev.tier){
          const t2 = String(l?.tier ?? "").trim();
          if (t2) prev.tier = t2;
        }

        by.set(itemId, prev);
      }
      return Array.from(by.values());
    }

    async function apiMarketItems(){
      let j = await fetchJson("/api/market/items");
      if (j && j.ok && Array.isArray(j.items)){
        const items = j.items.map(normalizeMarketItem).filter(Boolean);
        return {ok:true, items};
      }

      j = await fetchJson("/api/market/listings");
      if (j && j.ok && Array.isArray(j.listings)){
        const grouped = groupItemsFromListings(j.listings);
        return {ok:true, items: grouped.map(normalizeMarketItem).filter(Boolean)};
      }

      return {ok:false, error: (j && j.error) ? String(j.error) : "\u041D\u0435\u0442 \u0434\u0430\u043D\u043D\u044B\u0445"};
    }

    async function apiItem(itemId){
      const j = await fetchJson(`/api/item?id=${encodeURIComponent(itemId)}`);
      if (!j || !j.ok || !j.item) return null;
      return j.item;
    }

    async function apiLots(itemId){
      const j = await fetchJson(`/api/market/listings?item_id=${encodeURIComponent(itemId)}`);
      if (!j || !j.ok || !Array.isArray(j.listings)) return [];
      return j.listings;
    }

    async function apiLot(lotId){
      const j = await fetchJson(`/api/market/lot?id=${encodeURIComponent(lotId)}`);
      if (!j || !j.ok || !j.lot) return null;
      return j;
    }

    async function apiMeCharacters(){
      const j = await fetchJson("/api/me/characters", {auth:true});
      if (!j || !j.ok || !Array.isArray(j.characters)) return {ok:false, characters:[], error: j?.error || "unauthorized"};
      return {ok:true, characters: j.characters};
    }

    async function apiMarketBuy(lotId, qty, characterId){
      const j = await fetchJson("/api/market/buy", {
        auth:true,
        json: { lot_id: Number(lotId), listing_id: Number(lotId), id: Number(lotId), qty: Number(qty), character_id: Number(characterId) }
      });
      if (!j || !j.ok) return {ok:false, error: j?.error || "\u041E\u0448\u0438\u0431\u043A\u0430"};
      return {ok:true, purchase: j.purchase};
    }

          row("\u041D\u0430\u0434\u0435\u0436\u043D\u043E\u0441\u0442\u044C", num(eq.reliability) + "%") +
          row("\u0411\u043E\u043D\u0443\u0441 \u043A \u043F\u0435\u0440\u0435\u043D\u043E\u0441\u043A\u0435", numSigned(eq.carry_capacity_bonus)) +

      } else if (type === "gloves" && eq){
        html += section(
          "\u0425\u0430\u0440\u0430\u043A\u0442\u0435\u0440\u0438\u0441\u0442\u0438\u043A\u0438 \u044D\u043A\u0438\u043F\u0438\u0440\u043E\u0432\u043A\u0438",
          row("\u041D\u0430\u0434\u0435\u0436\u043D\u043E\u0441\u0442\u044C", num(eq.reliability) + "%") +
          row("\u0411\u043E\u043D\u0443\u0441 \u043A \u0442\u043E\u0447\u043D\u043E\u0441\u0442\u0438", numSigned(eq.accuracy_bonus)) +
          row("\u0412\u0435\u0441", kg(w))
        );
      } else if (type === "boots" && eq){
        html += section(
          "\u0425\u0430\u0440\u0430\u043A\u0442\u0435\u0440\u0438\u0441\u0442\u0438\u043A\u0438 \u044D\u043A\u0438\u043F\u0438\u0440\u043E\u0432\u043A\u0438",
          row("\u041D\u0430\u0434\u0435\u0436\u043D\u043E\u0441\u0442\u044C", num(eq.reliability) + "%") +
          row("\u0411\u043E\u043D\u0443\u0441 \u043A \u0441\u043A\u0440\u044B\u0442\u043D\u043E\u0441\u0442\u0438", numSigned(eq.stealth_bonus)) +
          row("\u0412\u0435\u0441", kg(w))
        );

        const caliber = item.caliber?.code || item.caliber?.name;
        const caliberHtml = caliber
          ? `<a class="link" data-caliber="${escapeHtml(caliber)}">${escapeHtml(caliber)}</a>`
          : "\u2013";

        html += section(
          "\u0425\u0430\u0440\u0430\u043A\u0442\u0435\u0440\u0438\u0441\u0442\u0438\u043A\u0438 \u043E\u0440\u0443\u0436\u0438\u044F",

        const bonusKeys = Object.keys(bonus || {}).filter(k => {

          const n = Number(v);
          return Number.isFinite(n) && n !== 0;

          const rows = bonusKeys.map(k => row(bonusKeyRu(k), numSigned(bonus[k]))).join("");

            if (Number(m.reliability_bonus || 0) !== 0) parts.push("\u043D\u0430\u0434\u0435\u0436\u043D\u043E\u0441\u0442\u044C " + numSigned(m.reliability_bonus));
            if (Number(m.damage_bonus || 0) !== 0) parts.push("\u0443\u0440\u043E\u043D " + numSigned(m.damage_bonus));
            if (Number(m.armor_pen_bonus || 0) !== 0) parts.push("\u043F\u0440\u043E\u0431\u0438\u0442\u0438\u0435 " + numSigned(m.armor_pen_bonus));

            const mid = Number(m.id || 0);

            return row("\u041C\u043E\u0434\u0443\u043B\u044C", escapeHtml(m.name || "\u041C\u043E\u0434\u0443\u043B\u044C") + (parts.length ? " \u2013 " + parts.join(", ") : ""));

        }
      }

      const mod = item.weapon_mod;
      if (mod){
        html += section(
          "\u0425\u0430\u0440\u0430\u043A\u0442\u0435\u0440\u0438\u0441\u0442\u0438\u043A\u0438 \u043C\u043E\u0434\u0443\u043B\u044F",
          row("\u0422\u0438\u043F", mod.mod_type || "\u2013") +
          row("Tier", mod.tier || "\u2013") +
          row("\u0411\u043E\u043D\u0443\u0441 \u043A \u0442\u043E\u0447\u043D\u043E\u0441\u0442\u0438", numSigned(mod.accuracy_bonus)) +
          row("\u0411\u043E\u043D\u0443\u0441 \u043A \u043D\u0430\u0434\u0435\u0436\u043D\u043E\u0441\u0442\u0438", numSigned(mod.reliability_bonus)) +
          row("\u0411\u043E\u043D\u0443\u0441 \u043A \u0443\u0440\u043E\u043D\u0443", numSigned(mod.damage_bonus)) +
          row("\u0411\u043E\u043D\u0443\u0441 \u043A \u043F\u0440\u043E\u0431\u0438\u0442\u0438\u044E", numSigned(mod.armor_pen_bonus)) +
          row("\u0412\u0435\u0441", kg(w))
        );
      }

      if (!eq && type !== "weapon" && type !== "ammo" && !mod){
        html += section("\u0425\u0430\u0440\u0430\u043A\u0442\u0435\u0440\u0438\u0441\u0442\u0438\u043A\u0438", row("\u0412\u0435\u0441", kg(w)) + row("\u0426\u0435\u043D\u0430", money(item.price)));
      }

      return html;
    }

    function bindLinks(app){
      app.querySelectorAll("[data-open-item]").forEach(el => {
        el.addEventListener("click", (ev) => {
          ev.preventDefault();
          const id = el.getAttribute("data-open-item");
          if (!id) return;
          openItem(id);
        });
      });

      app.querySelectorAll("[data-caliber]").forEach(el => {
        el.addEventListener("click", (ev) => {
          ev.preventDefault();
          const code = el.getAttribute("data-caliber");
          if (!code) return;
          showModal("\u041A\u0430\u043B\u0438\u0431\u0440", [row("\u041A\u043E\u0434", code)]);
        });
      });

      app.querySelectorAll("[data-market-item]").forEach(el => {
        el.addEventListener("click", (ev) => {
          ev.preventDefault();
          const id = el.getAttribute("data-market-item");
          if (!id) return;
          openItem(id);
        });
      });

      app.querySelectorAll("[data-lot]").forEach(el => {
        el.addEventListener("click", (ev) => {
          ev.preventDefault();
          const id = el.getAttribute("data-lot");
          if (!id) return;
          openLot(id);
        });
      });

      const back = app.querySelector("[data-back]");
      if (back){
        back.addEventListener("click", (ev) => {
          ev.preventDefault();
          openItems();
        });
      }

      app.querySelectorAll("[data-back-item]").forEach((el) => {
        el.addEventListener("click", (ev) => {
          ev.preventDefault();
          const id = el.getAttribute("data-back-item");
          if (!id) return;
          openItem(id);
        });
      });

      app.querySelectorAll("[data-qty-inc]").forEach((el) => {
        el.addEventListener("click", (ev) => {
          ev.preventDefault();
          const max = Number(el.getAttribute("data-qty-max") || 1);
          const inp = document.getElementById("buyQty");
          if (!inp) return;
          let v = Number(inp.value || 1);
          if (!Number.isFinite(v) || v < 1) v = 1;
          v = Math.min(max, v + 1);
          inp.value = String(v);
          updateBuyHint();
        });
      });

      app.querySelectorAll("[data-qty-dec]").forEach((el) => {
        el.addEventListener("click", (ev) => {
          ev.preventDefault();
          const inp = document.getElementById("buyQty");
          if (!inp) return;
          let v = Number(inp.value || 1);
          if (!Number.isFinite(v) || v < 1) v = 1;
          v = Math.max(1, v - 1);
          inp.value = String(v);
          updateBuyHint();
        });
      });

      const qtyInp = app.querySelector("#buyQty");
      if (qtyInp){
        qtyInp.addEventListener("input", () => {
          updateBuyHint();
        });
      }

      app.querySelectorAll("[data-buy-lot]").forEach((el) => {
        el.addEventListener("click", async (ev) => {
          ev.preventDefault();
          const lotId = Number(el.getAttribute("data-buy-lot") || 0);
          const lotQty = Number(el.getAttribute("data-lot-qty") || 0);
          const lotPrice = Number(el.getAttribute("data-lot-price") || 0);
          const itemId = Number(el.getAttribute("data-item-id") || 0);
          if (!lotId || !lotQty) return;

          const inp = document.getElementById("buyQty");
          let qty = Number(inp?.value || 1);
          if (!Number.isFinite(qty) || qty < 1) qty = 1;
          qty = Math.min(lotQty, qty);

          const cid = await ensureCharacterId();
          if (!cid) return;

          el.disabled = true;
          try{
            const res = await apiMarketBuy(lotId, qty, cid);
            if (!res.ok){
              notify(String(res.error || "\u041E\u0448\u0438\u0431\u043A\u0430"));
              return;
            }

            const paid = calcPrice(lotPrice, lotQty, qty);
            notify(`\u041A\u0443\u043F\u043B\u0435\u043D\u043E \u00D7${qty} \u0437\u0430 ${moneyPlain(paid)}`);
            if (itemId > 0){
              openItem(itemId, {replace:true});
            } else {
              openItems({replace:true});
            }
          }finally{
            el.disabled = false;
          }
        });
      });

      const refresh = app.querySelector("[data-refresh]");
      if (refresh){
        refresh.addEventListener("click", (ev) => {
          ev.preventDefault();
          const st = getStartState();
          if (st?.view === "item") loadItem(st.id);
          else if (st?.view === "lot" && st?.lot && st?.id) loadLotInItem(st.id, st.lot);
          else if (st?.view === "lot" && st?.lot) loadLotOnly(st.lot);
          else loadItems();
        });
      }

      const search = app.querySelector("#q");
      if (search){
        search.addEventListener("input", () => {
          renderItemsFiltered();
        });
      }
    }

    const CHAR_STORE_KEY = "ze.market.character_id";

    function loadSavedCharacterId(){
      try{
        const v = localStorage.getItem(CHAR_STORE_KEY) || "";
        if (/^\d+$/.test(v)) return Number(v);
      }catch(e){}
      return null;
    }

    function saveCharacterId(cid){
      try{ localStorage.setItem(CHAR_STORE_KEY, String(cid)); }catch(e){}
    }

    async function ensureCharacterId(){
      const existing = loadSavedCharacterId();
      if (existing && existing > 0) return existing;

      const res = await apiMeCharacters();
      if (!res.ok){
        notify("\u041D\u0435 \u0443\u0434\u0430\u043B\u043E\u0441\u044C \u043F\u043E\u043B\u0443\u0447\u0438\u0442\u044C \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\u0439");
        return null;
      }

      const chars = (res.characters || []).filter(c => Number(c?.id||0) > 0);
      if (!chars.length){
        notify("\u041D\u0435\u0442 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\u0439");
        return null;
      }

      if (chars.length === 1){
        const cid = Number(chars[0].id);
        saveCharacterId(cid);
        return cid;
      }

      return await new Promise((resolve) => {
        const rows = chars.map((c) => {
          const cid = Number(c.id);
          const name = escapeHtml(c.name || ("#" + cid));
          const faction = c.faction ? (" \u2013 " + escapeHtml(c.faction)) : "";
          return rowHtml(
            "",
            `<button class="btnSmall" data-pick-char="${escapeHtml(cid)}">${name}${faction}</button>`
          );
        });

        showModal("\u0412\u044B\u0431\u0435\u0440\u0438 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0430", rows);

        const rowsEl = document.getElementById("modalRows");
        rowsEl.querySelectorAll("[data-pick-char]").forEach((btn) => {
          btn.addEventListener("click", (ev) => {
            ev.preventDefault();
            const cid = Number(btn.getAttribute("data-pick-char") || 0);
            if (cid > 0){
              hideModal();
              saveCharacterId(cid);
              resolve(cid);
            }
          });
        });
      });
    }

    let _itemsCache = [];
    let _itemsFiltered = [];

    function renderItemsFiltered(){
      const app = document.getElementById("app");
      const q = (app.querySelector("#q")?.value || "").trim().toLowerCase();

      if (!q){
        _itemsFiltered = _itemsCache.slice();
      } else {
        _itemsFiltered = _itemsCache.filter(it => {
          const name = String(it.name || "").toLowerCase();
          const type = String(it.item_type || "").toLowerCase();
          const tier = String(it.tier || "").toLowerCase();
          return name.includes(q) || type.includes(q) || tier.includes(q);
        });
      }

      const listHtml = renderItemsRows(_itemsFiltered);
      const listHost = app.querySelector("#itemsRows");
      if (listHost) listHost.innerHTML = listHtml;
      bindLinks(app);
    }

    function renderItemsRows(items){
      if (!items || !items.length){
        return row("\u2013", "\u041D\u0438\u0447\u0435\u0433\u043E \u043D\u0435\u0442");
      }

      return items.map((it, idx) => {
        const name = escapeHtml(it.name || "\u041F\u0440\u0435\u0434\u043C\u0435\u0442");
        const id = String(it.item_id);
        const type = String(it.item_type || "misc").trim() || "misc";
        const tier = String(it.tier || "").trim();

        const bits = [];
        if (!isMiscType(type) && tier){
          bits.push(escapeHtml(tier));
        }
        bits.push(escapeHtml(type));

        const tail = bits.length ? (" \u2013 " + bits.join(" \u2013 ")) : "";
        const cnt = Number(it.lots_count || 0);
        const pill = cnt > 0 ? `<span class="pill">\u043B\u043E\u0442\u043E\u0432 ${escapeHtml(cnt)}</span>` : "";

        const line = `<a class="link" data-market-item="${escapeHtml(id)}">${name}</a>${pill}${tail}`;
        return rowHtml(String(idx + 1), line);
      }).join("");
    }

    function renderItemsView(items){
      const app = document.getElementById("app");

      const top = `
        <div class="title">
          <div>
            <h1>Market</h1>
            <div class="sub">\u0412\u044B\u0431\u0435\u0440\u0438 \u0442\u043E\u0432\u0430\u0440, \u0447\u0442\u043E\u0431\u044B \u0443\u0432\u0438\u0434\u0435\u0442\u044C \u043B\u043E\u0442\u044B</div>
          </div>
          <button class="btnSmall" data-refresh>\u041E\u0431\u043D\u043E\u0432\u0438\u0442\u044C</button>
        </div>
      `;

      const search = `
        <div class="inputRow" style="margin-top: 0;">
          <input id="q" class="inp" placeholder="\u041F\u043E\u0438\u0441\u043A \u043F\u043E \u043D\u0430\u0437\u0432\u0430\u043D\u0438\u044E, \u0442\u0438\u043F\u0443, \u0442\u0438\u0440\u0443" />
        </div>
      `;

      const rowsHtml = renderItemsRows(items);

      const listSection = `
        <div class="section">
          <h2>\u0422\u043E\u0432\u0430\u0440\u044B \u043D\u0430 \u0440\u044B\u043D\u043A\u0435</h2>
          <div class="rows" id="itemsRows">${rowsHtml}</div>
        </div>
      `;

      app.innerHTML = top + search + listSection;
      bindLinks(app);
    }

    function renderLotsView(item, lots){
      const app = document.getElementById("app");

      const right = `<button class="btnSmall" data-back>\u041D\u0430\u0437\u0430\u0434</button>`;
      let html = renderItemCommon(item, {rightHtml: right, hideMarket:false});

      let totalQty = 0;
      let minPrice = null;
      let maxPrice = null;

      for (const l of (lots || [])){
        const q = Number(l.qty || 0);
        if (Number.isFinite(q)) totalQty += q;
        const p = Number(l.price || 0);
        if (Number.isFinite(p) && p > 0){
          if (minPrice == null || p < minPrice) minPrice = p;
          if (maxPrice == null || p > maxPrice) maxPrice = p;
        }
      }

      const range = (minPrice == null || maxPrice == null)
        ? "\u2013"
        : (minPrice === maxPrice ? moneyPlain(minPrice) : `${moneyPlain(minPrice)}\u2013${moneyPlain(maxPrice)}`);

      html += section(
        "\u041B\u043E\u0442\u044B",
        rowHtml(
          "",
          `<div class="sub">\u0412\u0441\u0435\u0433\u043E: \u00D7${escapeHtml(totalQty)} \u2022 \u0426\u0435\u043D\u0430: ${escapeHtml(range)}</div>`
        )
      );

      const rows = (lots || []).map((l, idx) => {
        const lotId = String(l.id ?? "");
        const qty = Number(l.qty || 0);
        const price = moneyPlain(l.price);
        const line = `\u041B\u043E\u0442 #${escapeHtml(lotId)} \u2013 \u00D7${escapeHtml(qty)} \u2013 ${escapeHtml(price)}`;
        return rowHtml(String(idx + 1), `<a class="link" data-lot="${escapeHtml(lotId)}">${line}</a>`);
      }).join("");

      html += section("\u0421\u043F\u0438\u0441\u043E\u043A", rows || row("\u2013", "\u041D\u0435\u0442"));

      app.innerHTML = html;
      bindLinks(app);
    }

    function renderLotDetailView(item, lot){
      const app = document.getElementById("app");

      const right = `<button class="btnSmall" data-back-item="${escapeHtml(item.id)}">\u041D\u0430\u0437\u0430\u0434</button>`;
      let html = renderItemCommon(item, {rightHtml: right, hideMarket:true});

      const lotId = Number(lot.id || 0);
      const qty = Number(lot.qty || 0);
      const price = Number(lot.price || 0);

      html += section(
        "\u041B\u043E\u0442",
        row("\u041B\u043E\u0442", "#" + String(lotId)) +
        row("\u0414\u043E\u0441\u0442\u0443\u043F\u043D\u043E", "\u00D7" + String(qty)) +
        row("\u0426\u0435\u043D\u0430", moneyPlain(price))
      );

      _buyCtx = {max: qty, lotQty: qty, lotPrice: price};

      const buyRow = `
        <div class="inputRow" style="margin-top:0;">
          <button class="btnSmall" data-qty-dec>\u2013</button>
          <input id="buyQty" class="inp" inputmode="numeric" value="1" style="text-align:center;" />
          <button class="btnSmall" data-qty-inc data-qty-max="${escapeHtml(qty)}">+</button>
          <button class="btn primary" data-buy-lot="${escapeHtml(lotId)}" data-lot-qty="${escapeHtml(qty)}" data-lot-price="${escapeHtml(price)}" data-item-id="${escapeHtml(item.id)}">\u041A\u0443\u043F\u0438\u0442\u044C</button>
        </div>
        <div class="sub" id="buyHint" style="text-align:center;margin-top:8px;"></div>
      `;

      html += section("\u041F\u043E\u043A\u0443\u043F\u043A\u0430", buyRow);
      html += renderItemStats(item);

      app.innerHTML = html;
      bindLinks(app);
      updateBuyHint();
    }

    async function loadItems(){
      const app = document.getElementById("app");
      app.innerHTML = `<div class="loading">\u0417\u0430\u0433\u0440\u0443\u0437\u043A\u0430</div>`;

      const res = await apiMarketItems();
      if (!res.ok){
        app.innerHTML = `
          <div class="loading" style="padding:0;">\u041D\u0435 \u043D\u0430\u0439\u0434\u0435\u043D\u043E</div>
          <div class="err">${escapeHtml(res.error || "\u041E\u0448\u0438\u0431\u043A\u0430 \u0437\u0430\u043F\u0440\u043E\u0441\u0430")}</div>
        `;
        return;
      }

      _itemsCache = (res.items || []).slice().sort((a,b) => String(a.name||"").localeCompare(String(b.name||""), "ru"));
      _itemsFiltered = _itemsCache.slice();
      renderItemsView(_itemsCache);
    }

    async function loadItem(itemId){
      const app = document.getElementById("app");
      app.innerHTML = `<div class="loading">\u0417\u0430\u0433\u0440\u0443\u0437\u043A\u0430</div>`;

      const [item, lots] = await Promise.all([apiItem(itemId), apiLots(itemId)]);

      if (!item){
        app.innerHTML = `
          <div class="loading" style="padding:0;">\u041D\u0435 \u043D\u0430\u0439\u0434\u0435\u043D\u043E</div>
          <div class="err">\u041E\u0448\u0438\u0431\u043A\u0430 \u0437\u0430\u043F\u0440\u043E\u0441\u0430</div>
        `;
        return;
      }

      renderLotsView(item, lots);
    }

    async function loadLotInItem(itemId, lotId){
      const app = document.getElementById("app");
      app.innerHTML = `<div class="loading">\u0417\u0430\u0433\u0440\u0443\u0437\u043A\u0430</div>`;

      const [item, jr] = await Promise.all([apiItem(itemId), apiLot(lotId)]);
      if (!item || !jr || !jr.ok || !jr.lot){
        app.innerHTML = `
          <div class="loading" style="padding:0;">\u041D\u0435 \u043D\u0430\u0439\u0434\u0435\u043D\u043E</div>
          <div class="err">${escapeHtml(jr?.error || "\u041E\u0448\u0438\u0431\u043A\u0430 \u0437\u0430\u043F\u0440\u043E\u0441\u0430")}</div>
        `;
        return;
      }

      renderLotDetailView(item, jr.lot);
    }

    async function loadLotOnly(lotId){
      const app = document.getElementById("app");
      app.innerHTML = `<div class="loading">\u0417\u0430\u0433\u0440\u0443\u0437\u043A\u0430</div>`;

      const jr = await apiLot(lotId);
      if (!jr || !jr.ok || !jr.item || !jr.lot){
        app.innerHTML = `
          <div class="loading" style="padding:0;">\u041D\u0435 \u043D\u0430\u0439\u0434\u0435\u043D\u043E</div>
          <div class="err">${escapeHtml(jr?.error || "\u041E\u0448\u0438\u0431\u043A\u0430 \u0437\u0430\u043F\u0440\u043E\u0441\u0430")}</div>
        `;
        return;
      }

      renderLotDetailView(jr.item, jr.lot);
    }

    function openItems(opts){
      const url = new URL(window.location.href);
      url.searchParams.delete("id");
      url.searchParams.delete("lot");
      url.searchParams.delete("startapp");
      const st = {view:"items"};
      if (opts?.replace) history.replaceState(st, "", url.toString());
      else history.pushState(st, "", url.toString());
      loadItems();
    }

    function openItem(itemId, opts){
      const url = new URL(window.location.href);
      url.searchParams.set("id", String(itemId));
      url.searchParams.delete("lot");
      const st = {view:"item", id:String(itemId)};
      if (opts?.replace) history.replaceState(st, "", url.toString());
      else history.pushState(st, "", url.toString());
      loadItem(itemId);
    }

    function openLot(lotId, opts){
      const p = new URLSearchParams(window.location.search);
      const itemId = p.get("id");

      if (itemId && /^\d+$/.test(itemId)){
        const url = new URL(window.location.href);
        url.searchParams.set("id", String(itemId));
        url.searchParams.set("lot", String(lotId));
        const st = {view:"lot", id:String(itemId), lot:String(lotId)};
        if (opts?.replace) history.replaceState(st, "", url.toString());
        else history.pushState(st, "", url.toString());
        loadLotInItem(itemId, lotId);
        return;
      }

      const url = new URL(window.location.href);
      url.searchParams.set("lot", String(lotId));
      const st = {view:"lot", lot:String(lotId)};
      if (opts?.replace) history.replaceState(st, "", url.toString());
      else history.pushState(st, "", url.toString());
      loadLotOnly(lotId);
    }

    function getStartState(){
      const p = new URLSearchParams(window.location.search);

      const lot = p.get("lot");
      if (lot && /^\d+$/.test(lot)){
        const id = p.get("id");
        if (id && /^\d+$/.test(id)) return {view:"lot", id, lot};
        return {view:"lot", lot};
      }

      const id = p.get("id");
      if (id && /^\d+$/.test(id)) return {view:"item", id};

      const sp = p.get("tgWebAppStartParam") || p.get("startapp");
      if (sp && /^l\d+$/.test(sp)) return {view:"lot", lot: sp.slice(1)};
      if (sp && /^i\d+$/.test(sp)) return {view:"item", id: sp.slice(1)};
      if (sp && /^m\d+$/.test(sp)) return {view:"item", id: sp.slice(1)};

      return {view:"items"};
    }

    function renderFallbackOpenById(){
      const app = document.getElementById("app");
      app.innerHTML = `
        <div>
          <div class="title">
            <div>
              <h1>Market</h1>
              <div class="sub">\u041D\u0435\u0442 \u0441\u043F\u0438\u0441\u043A\u0430 \u0442\u043E\u0432\u0430\u0440\u043E\u0432</div>
            </div>
            <button class="btnSmall" data-back>\u041D\u0430\u0437\u0430\u0434</button>
          </div>

          <div class="inputRow">
            <input id="iid" class="inp" inputmode="numeric" placeholder="ID \u043F\u0440\u0435\u0434\u043C\u0435\u0442\u0430" />
            <button id="go" class="btn">\u041E\u0442\u043A\u0440\u044B\u0442\u044C</button>
          </div>
        </div>
      `;

      document.getElementById("go").addEventListener("click", () => {
        const v = document.getElementById("iid").value.trim();
        if (!/^\d+$/.test(v)) return;
        openItem(v);
      });

      bindLinks(app);
    }

    try{
      if (window.Telegram && Telegram.WebApp){
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        const tp = Telegram.WebApp.themeParams || {};
        if (tp.bg_color) document.documentElement.style.setProperty("--bg", tp.bg_color);
        if (tp.text_color) document.documentElement.style.setProperty("--text", tp.text_color);
        if (tp.hint_color) document.documentElement.style.setProperty("--muted", tp.hint_color);
        if (tp.button_color) document.documentElement.style.setProperty("--accent", tp.button_color);
      }
    }catch(e){}

    /* Hide bottom nav when embedded in an iframe */
    try {
      if (window.self !== window.top) {
        const nav = document.querySelector('.bottomNav');
        if (nav) nav.style.display = 'none';
        document.querySelector('.wrap').style.paddingBottom = '16px';
      }
    } catch(e) {}

    const first = getStartState();

    if (first.view === "lot"){
      if (first.id) loadLotInItem(first.id, first.lot);
      else loadLotOnly(first.lot);
    } else if (first.view === "item"){
      loadItem(first.id);
    } else {
      loadItems().catch(() => renderFallbackOpenById());
    }

    window.addEventListener("popstate", () => {
      const s = getStartState();
      if (s.view === "lot"){
        if (s.id) loadLotInItem(s.id, s.lot);
        else loadLotOnly(s.lot);
      }
      else if (s.view === "item"){
        loadItem(s.id);
      } else loadItems().catch(() => renderFallbackOpenById());
    });
  </script>
</body>
</html>
