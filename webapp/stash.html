<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Склад</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

    :root{
      --bg: #0a0e14;
      --bg2: #0d1117;
      --card: #131920;
      --card2: #111720;
      --card-hover: #181f28;
      --text: #e8edf5;
      --muted: #8899ad;
      --stroke: rgba(255,255,255,.06);
      --stroke-hover: rgba(255,255,255,.12);
      --accent: #3b8ff5;
      --accent-glow: rgba(59,143,245,.15);
      --accent-text: #7ab8ff;
      --warn: #f5c842;
      --warn-glow: rgba(245,200,66,.1);
      --success: #34d399;
      --danger: #f87171;
      --radius: 14px;
      --radius-sm: 10px;
      --pad: 16px;
      --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      --mono: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --nav-height: 64px;
    }

    html, body { height: 100%; }
    body{
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    .wrap{
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 14px;
      padding-bottom: calc(var(--nav-height) + 24px + env(safe-area-inset-bottom, 0px));
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: var(--pad);
      box-shadow:
        0 2px 8px rgba(0,0,0,.2),
        0 12px 40px rgba(0,0,0,.15);
      backdrop-filter: blur(12px);
    }

    .card + .card{ margin-top: 12px; }

    .title{
      display:flex;
      gap: 12px;
      align-items:flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    h1{
      margin:0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.2px;
      background: linear-gradient(135deg, var(--text) 0%, var(--muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sub{
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .badges{
      margin-top: 10px;
      display:flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge{
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.03);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge.tier{
      border-color: rgba(59,143,245,.3);
      background: var(--accent-glow);
      color: var(--accent-text);
    }

    .section{
      margin-top: 16px;
      border-top: 1px solid var(--stroke);
      padding-top: 14px;
    }

    .section h2{
      margin: 0 0 10px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .rows{
      display:flex;
      flex-direction: column;
      gap: 6px;
    }

    .row{
      display:flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border: 1px solid var(--stroke);
      border-radius: var(--radius-sm);
      background: rgba(0,0,0,.15);
      transition: background .15s, border-color .15s;
    }

    .row:hover{
      background: rgba(0,0,0,.25);
      border-color: var(--stroke-hover);
    }

    .k{
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .v{
      font-size: 14px;
      font-weight: 600;
      text-align: right;
    }

    .v.mono{
      font-family: var(--mono);
      font-weight: 700;
      letter-spacing: .3px;
    }

    .row.stars{
      border-color: rgba(245,200,66,.2);
      background: var(--warn-glow);
    }

    .btn{
      border: 1px solid var(--stroke-hover);
      background: rgba(255,255,255,.04);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      font-family: var(--sans);
    }

    .btn:hover{
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.2);
    }

    .btn:active{ transform: scale(0.97); }

    .inputRow{
      display:flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .inp{
      flex: 1;
      border: 1px solid var(--stroke);
      background: rgba(0,0,0,.25);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      font-family: var(--sans);
      transition: border-color .15s;
    }

    .inp:focus{
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .inp::placeholder{ color: var(--muted); opacity: 0.6; }

    .loading{
      color: var(--muted);
      padding: 32px 6px;
      text-align:center;
      font-size: 14px;
    }

    .loading::after{
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      margin-left: 8px;
      border: 2px solid var(--stroke);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .err{
      color: var(--danger);
      font-size: 13px;
      margin-top: 8px;
      text-align:center;
      padding: 8px;
      background: rgba(248,113,113,.06);
      border-radius: var(--radius-sm);
    }

    .link{
      color: var(--accent-text);
      cursor: pointer;
      text-decoration: none;
      transition: opacity .15s;
    }

    .link:hover{ opacity: .85; }
    .link:active{ opacity: .7; }

    .modalBg{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      display:none;
      align-items: flex-end;
      justify-content: center;
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
    }

    .modal{
      width: 100%;
      max-width: 520px;
      background: var(--card2);
      border: 1px solid var(--stroke-hover);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 -4px 40px rgba(0,0,0,.4);
      animation: slideUp .25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modalTop{
      display:flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .modalTitle{
      font-size: 16px;
      font-weight: 700;
    }

    .xBtn{
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }

    .xBtn:hover{
      background: rgba(255,255,255,.08);
      color: var(--text);
    }

    /* ── Back button ── */
    .backBtn{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid var(--stroke);
      color: var(--accent-text);
      font-size: 13px;
      font-weight: 600;
      font-family: var(--sans);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all .15s;
      margin-bottom: 12px;
    }

    .backBtn:hover{
      background: var(--accent-glow);
      border-color: rgba(59,143,245,.3);
    }

    .backBtn svg{
      width: 16px;
      height: 16px;
    }

    /* ── Stash header ── */
    .stashHeader{
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .stashAvatar{
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-glow), rgba(59,143,245,.08));
      border: 1px solid rgba(59,143,245,.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stashAvatar svg{
      width: 24px;
      height: 24px;
      color: var(--accent-text);
    }

    .stashInfo h1{
      font-size: 20px;
    }

    .stashWeight{
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
      font-family: var(--mono);
      font-weight: 600;
    }

    .stashWeight svg{
      width: 14px;
      height: 14px;
      opacity: .7;
    }

    /* ── Equipment section ── */
    .equipSection{
      margin-top: 16px;
    }

    .equipTitle{
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .equipTitle svg{
      width: 16px;
      height: 16px;
      color: var(--accent-text);
    }

    .equipTitle span{
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .equipItem{
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--stroke);
      border-radius: var(--radius-sm);
      background: rgba(0,0,0,.15);
      cursor: pointer;
      transition: all .15s;
    }

    .equipItem + .equipItem{ margin-top: 6px; }

    .equipItem:hover{
      background: rgba(0,0,0,.25);
      border-color: var(--stroke-hover);
    }

    .equipItem:active{ transform: scale(0.985); }

    .equipSlotIcon{
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--stroke);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .equipSlotIcon svg{
      width: 18px;
      height: 18px;
      color: var(--muted);
    }

    .equipItem:hover .equipSlotIcon{
      background: var(--accent-glow);
      border-color: rgba(59,143,245,.25);
    }

    .equipItem:hover .equipSlotIcon svg{
      color: var(--accent-text);
    }

    .equipMeta{
      flex: 1;
      min-width: 0;
    }

    .equipName{
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .equipDetails{
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
    }

    .equipDetails .dot{
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--muted);
      opacity: .5;
    }

    .emptySlot{
      color: var(--muted);
      opacity: .5;
      font-size: 13px;
      padding: 10px 14px;
      border: 1px dashed var(--stroke);
      border-radius: var(--radius-sm);
      text-align: center;
    }

    /* ── Inventory list ── */
    .invItem{
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--stroke);
      border-radius: var(--radius-sm);
      background: rgba(0,0,0,.15);
      cursor: pointer;
      transition: all .15s;
    }

    .invItem + .invItem{ margin-top: 6px; }

    .invItem:hover{
      background: rgba(0,0,0,.25);
      border-color: var(--stroke-hover);
    }

    .invItem:active{ transform: scale(0.985); }

    .invNum{
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--stroke);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
      font-family: var(--mono);
    }

    .invMeta{
      flex: 1;
      min-width: 0;
    }

    .invName{
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .invDetails{
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
    }

    .invDetails .dot{
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--muted);
      opacity: .5;
    }

    .invQty{
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-text);
      background: var(--accent-glow);
      border: 1px solid rgba(59,143,245,.2);
      padding: 3px 8px;
      border-radius: 6px;
      flex-shrink: 0;
      font-family: var(--mono);
    }

    /* ── Pagination ── */
    .pagination{
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
    }

    .pgBtn{
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.03);
      color: var(--muted);
      cursor: pointer;
      font-family: var(--sans);
      transition: all .15s;
    }

    .pgBtn:hover:not(:disabled){
      background: rgba(255,255,255,.08);
      border-color: var(--stroke-hover);
      color: var(--text);
    }

    .pgBtn:disabled{
      opacity: .3;
      cursor: not-allowed;
    }

    .pgBtn svg{
      width: 18px;
      height: 18px;
    }

    .pgInfo{
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      min-width: 80px;
      text-align: center;
    }

    /* tier color coding */
    .tier-a{ color: #f87171; }
    .tier-b{ color: #fb923c; }
    .tier-c{ color: #facc15; }
    .tier-d{ color: #94a3b8; }

    .rarity-common{ color: var(--muted); }
    .rarity-uncommon{ color: #34d399; }
    .rarity-rare{ color: #60a5fa; }
    .rarity-epic{ color: #c084fc; }
    .rarity-legendary{ color: #fbbf24; }

    /* ── Bottom Navigation ── */
    .bottomNav{
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--bg2);
      border-top: 1px solid var(--stroke);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      z-index: 90;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .navBtn{
      flex: 1;
      max-width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 0;
      border: none;
      background: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      font-family: var(--sans);
      cursor: pointer;
      text-decoration: none;
      transition: color .15s;
      letter-spacing: 0.3px;
      border-radius: 8px;
    }

    .navBtn:hover{ color: var(--text); }

    .navBtn.active{ color: var(--accent-text); }

    .navBtn.active .navIcon{
      background: var(--accent-glow);
      border-color: rgba(59,143,245,.25);
    }

    .navIcon{
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: all .15s;
    }

    .navIcon svg{
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <div class="wrap" id="root">
    <div class="card" id="app">
      <div class="loading">Загрузка</div>
    </div>
  </div>

  <nav class="bottomNav">
    <a href="/stash" class="navBtn active" id="navStash">
      <div class="navIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        </svg>
      </div>
      <span>Склад</span>
    </a>
    <a href="/market" class="navBtn" id="navMarket">
      <div class="navIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
      </div>
      <span>Рынок</span>
    </a>
  </nav>
  <div class="modalBg" id="modalBg">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalTop">
        <div class="modalTitle" id="modalTitle">Калибр</div>
        <button class="xBtn" id="modalClose" aria-label="Закрыть">&#x2715;</button>
      </div>
      <div class="rows" id="modalRows"></div>
    </div>
  </div>
</body>
</html>
